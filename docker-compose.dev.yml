services:
  web-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: pet-b-fm-dev
    command: yarn dev
    ports:
      - "3000:3000"
    volumes:
      # Монтируем исходный код для hot-reload
      - ./app:/app/app
      - ./pages:/app/pages
      - ./public:/app/public
      - ./components:/app/components
      - ./.env:/app/.env
      # Пробрасываем конфиги для TypeScript, Tailwind, PostCSS, ESLint
      - ./tsconfig.json:/app/tsconfig.json
      - ./tailwind.config.ts:/app/tailwind.config.ts
      - ./postcss.config.js:/app/postcss.config.js
      - ./next.config.mjs:/app/next.config.mjs
      # Изолируем node_modules и .next от хоста
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    restart: unless-stopped